name: Push
run-name: ${{ github.ref_name }} build
on:
  push:
    branches: [master, main, 'release/**']
    tags: ['*']
permissions:
  contents: read
jobs:
  check-format:
    name: Check Formatting
    uses: ./.github/workflows/check-format.yaml
  build-project:
    name: Build Windows ZIP
    uses: ./.github/workflows/build-project.yaml
  create-release:
    name: Create Windows release with patch notes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [check-format, build-project]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN_VERSION: ${{ needs.build-project.outputs.pluginVersion }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: obs-dlss5-nr-${{ env.PLUGIN_VERSION }}-windows-x64
          path: release-assets
      - name: Validate tag, asset and patch notes
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME#v}" = "$PLUGIN_VERSION"
          test -s "docs/releases/$PLUGIN_VERSION.md"
          asset="release-assets/obs-dlss5-nr-$PLUGIN_VERSION-windows-x64.zip"
          test -s "$asset"
          test "$(find release-assets -type f | wc -l)" -eq 1
          cp "docs/releases/$PLUGIN_VERSION.md" release-body.md
          printf '\n## SHA-256\n\n`%s`\n' "$(sha256sum "$asset" | cut -d ' ' -f 1)" >> release-body.md
      - name: Create draft and upload only the Windows ZIP using curl
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          jq -n --arg tag "$GITHUB_REF_NAME" --arg name "DLSS 5 Neural Rendering $PLUGIN_VERSION" \
            --rawfile body release-body.md \
            '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:($tag|test("-(beta|rc)"))}' > release.json
          status=$(curl --silent --show-error "${headers[@]}" -o existing.json -w '%{http_code}' "$api/releases/tags/$GITHUB_REF_NAME")
          if [[ "$status" == 404 ]]; then
            curl --fail-with-body --silent --show-error "${headers[@]}" -H 'Content-Type: application/json' \
              --data-binary @release.json "$api/releases" -o created.json
          elif [[ "$status" == 200 ]] && [[ "$(jq -r .draft existing.json)" == true ]]; then
            id=$(jq -r .id existing.json)
            # Only a draft owned by this release is refreshed on a workflow retry.
            jq -e --arg asset "obs-dlss5-nr-$PLUGIN_VERSION-windows-x64.zip" 'all(.assets[]; .name == $asset)' existing.json
            for asset_id in $(jq -r '.assets[].id' existing.json); do
              curl --fail-with-body --silent --show-error "${headers[@]}" -X DELETE "$api/releases/assets/$asset_id"
            done
            curl --fail-with-body --silent --show-error "${headers[@]}" -X PATCH -H 'Content-Type: application/json' \
              --data-binary @release.json "$api/releases/$id" -o created.json
          else
            echo 'Release lookup failed or tag already has a published release; refusing to overwrite it.' >&2
            exit 1
          fi
          id=$(jq -r .id created.json)
          asset="obs-dlss5-nr-$PLUGIN_VERSION-windows-x64.zip"
          curl --fail-with-body --silent --show-error "${headers[@]}" -H 'Content-Type: application/zip' \
            --data-binary "@release-assets/$asset" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$asset" -o uploaded.json
          jq -e --arg name "$asset" '.name == $name and .state == "uploaded"' uploaded.json
